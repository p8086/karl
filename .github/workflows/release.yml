name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - name: Test
        run: |
          python3 tests/check_locales.py
          python3 tests/test_core.py
          python3 tests/test_integration.py
          python3 tests/test_browse.py
      - name: Il tag corrisponde alla versione
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python3 -c "import karl; print(karl.VERSION)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} ma karl/__init__.py dice $v"; exit 1; }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Karl.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Karl --icon karl\assets\icon.ico
          --add-data "karl\assets;karl\assets"
          --add-data "karl\locales;karl\locales"
          --add-data "karl\loader;karl\loader"
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Karl.exe

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Python con Tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv
      - name: karl
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt pyinstaller
          .venv/bin/python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name karl \
            --add-data "karl/assets:karl/assets" \
            --add-data "karl/locales:karl/locales" \
            --add-data "karl/loader:karl/loader" \
            main.py
      - name: Pacchetto
        run: |
          mkdir -p pkg/karl
          cp dist/karl pkg/karl/karl
          cp karl/assets/icon_256.png pkg/karl/karl.png
          cp packaging/install_linux.sh pkg/karl/install.sh
          chmod +x pkg/karl/karl pkg/karl/install.sh
          tar -C pkg -czf karl-linux-x86_64.tar.gz karl
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: karl-linux-x86_64.tar.gz

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          name: Karl ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/windows/Karl.exe
            out/linux/karl-linux-x86_64.tar.gz
